[project]
name = "schneider-challenge"
version = "0.1.0"
description = "We'll put the description here"
readme = "README.md"
authors = [
    { name = "Kenza Chaabouni", email = "kenza.chaabouni@hec.edu" },
    { name = "Hitaishi Dhoowooah", email = "hitaishi.dhoowooah@hec.edu"},
    { name = "Ion de Merlis", email = "ion.goursaud-de-merlis@hec.edu"},
    { name = "Chloé Vacca", email = "chloe.vacca@hec.edu"},
    { name = "Karin Yamakawa", email = "karin.yamakawa@hec.edu"}
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "openpyxl>=3.1.5",
    "pandas>=3.1.1",
    "pyyaml>=6.0.3",
    "scipy>=1.18.1",
    "statsmodels>=0.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "nbclient>=0.11.0",
    "nbconvert>=7.17.2",
    "nbformat>=5.11.1",
    "ruff>=0.17.5",
]
